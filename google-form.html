<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback on the Digital Coffee Table Book of Chhatrapati Sambhajinagar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', 'Arial', sans-serif;
            background-color: #f0f0f0;
            padding: 0;
            color: #202124;
            margin: 0;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
        }
        
        @media (min-width: 800px) {
            .container {
                max-width: 770px;
                padding: 12px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0;
            }
        }
        
        .banner {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: block;
            object-fit: cover;
        }
        
        .banner-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            border-radius: 0;
            background: linear-gradient(90deg, #0a0e27 0%, #1a237e 30%, #0d47a1 70%, #01579b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 0;
        }
        
        @media (min-width: 800px) {
            .banner-wrapper {
                border-radius: 8px;
                margin-bottom: 12px;
            }
        }
        
        @media (max-width: 768px) {
            .banner-wrapper {
                height: 100px;
            }
        }
        
        @media (max-width: 480px) {
            .banner-wrapper {
                height: 80px;
            }
        }
        
        .iframe-container {
            background: transparent;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            margin-bottom: 0;
            width: 100%;
            height: 100vh;
            position: relative;
        }
        
        @media (min-width: 800px) {
            .iframe-container {
                background: white;
                border-radius: 8px;
                box-shadow: 0 1px 2px rgba(0,0,0,0.1);
                margin-bottom: 12px;
                height: auto;
            }
        }
        
        iframe {
            width: 100%;
            border: none;
            display: block;
            height: 100%;
            min-height: 100vh;
        }
        
        @media (min-width: 800px) {
            iframe {
                min-height: 2200px;
            }
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #70757a;
            margin-top: 12px;
        }
        
        @media (max-width: 480px) {
            .footer {
                font-size: 11px;
                padding: 16px;
            }
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #5f6368;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner-wrapper">
            <img src="header.png" alt="Chhatrapati Sambhajinagar - A People-Driven Smart City" class="banner" onerror="this.style.display='none'">
        </div>
        
        <div class="iframe-container">
            <div class="loading" id="loading">Loading form...</div>
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLSeBuVRHQ4kScbJPsx2f9Pf40rEVxead75q2uzUD4Muf5ZqzBg/viewform?embedded=true" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0"
                onload="document.getElementById('loading').style.display='none'">
                Loading…
            </iframe>
        </div>
        
        <div class="footer">
            This form was created by MIPL
        </div>
    </div>
</body>
</html>
